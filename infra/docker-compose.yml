services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sica-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sica-ictus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sica-ictus-dev}
      POSTGRES_DB: ${POSTGRES_DB:-sica-ictus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sica-ictus} -d ${POSTGRES_DB:-sica-ictus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sica-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
      build:
        context: ..
        dockerfile: infra/Dockerfile.api.dev
      container_name: sica-api
      ports:
        - "8000:8000"
      environment:
        DATABASE_URL: postgresql+asyncpg://sica-ictus:sica-ictus-dev@postgres:5432/sica-ictus
        REDIS_URL: redis://redis:6379
        JWT_SECRET: ${JWT_SECRET}
        SINGLE_USER_MODE: ${SINGLE_USER_MODE:-true}
        ENVIRONMENT: development
        LOG_LEVEL: ${LOG_LEVEL:-INFO}
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      volumes:
        # Mount source code for hot reload
        - ../apps/api/src:/app/src
        # Anonymous volume for .venv so the host venv doesn't shadow the container's
        - /app/.venv
      restart: unless-stopped

volumes:
  postgres_data:
    name: sica-ictus_postgres_data
  redis_data:
    name: sica-ictus_redis_data